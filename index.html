<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Expenses</title>
    <meta name="description" content="Local-only expense and income tracker in euros. Your data stays on this device.">
    <meta name="theme-color" content="#DDE4DA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F1612" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preload" href="fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
    <a class="skip-link" href="#view">Skip to content</a>
    <header class="app-header"><h1 id="screen-title">Home</h1></header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main">
        <button type="button" class="tab" data-tab="add">Home</button>
        <button type="button" class="tab" data-tab="month">Month</button>
        <button type="button" class="tab" data-tab="chart">Chart</button>
        <button type="button" class="tab" data-tab="more">Settings</button>
    </nav>

    <script type="module" src="src/app.js"></script>
</body>
</html>
