# Mirrors cards/ (one file per card), PROJECT_MAP.json and RELEASE_PLAN.json to the GitHub Project.
# Text and fields only: Status is set when an item is created (Backlog for cards) and never changed afterwards;
# the owner and the planner move cards on the board.
# Push to main: diff mode, only items changed in the push are touched. Manual run: choose the mode.
# Setup by the owner: secret PROJECT_TOKEN (project scope). Project number is set below.
name: Board sync

on:
  push:
    branches: [main]
    paths:
      - 'cards/**'
      - PROJECT_MAP.json
      - RELEASE_PLAN.json
      - scripts/board-sync.mjs
      - scripts/cards.mjs
      - .github/workflows/board-sync.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'diff = last push only, all = create missing items, all-force = also rewrite text and fields of existing items (never Status)'
        type: choice
        options: [diff, all, all-force]
        default: all

permissions:
  contents: read

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync board
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || '1Lev1user' }}
          PROJECT_NUMBER: '1'  # project number is not secret; owner's board is number 1
          MODE: ${{ inputs.mode || 'diff' }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$PROJECT_TOKEN" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "::notice::Board sync not configured (owner sets secret PROJECT_TOKEN)."
            exit 0
          fi
          case "$MODE" in
            all) node scripts/board-sync.mjs --all ;;
            all-force) node scripts/board-sync.mjs --all --force ;;
            *)
              BASE="$BEFORE"
              if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
                BASE=HEAD~1
              fi
              node scripts/board-sync.mjs --base "$BASE" ;;
          esac
