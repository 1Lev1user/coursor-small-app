name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      - run: npm run check:kit
      # Card branches (card/C-NNN-...) may change only the card's allowed_paths; the card is read from the base branch.
      - name: Card guard
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'card/')
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: npm run check:card -- --base "origin/$BASE_REF" --branch "$HEAD_REF"
